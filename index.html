<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>自己主張タイプ診断</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{--teal:#0E7C86;--deep:#0A5A62;--ink:#1C3236;--ink2:#4A6468;--soft:#EEF6F7;--line:#D5E4E6;--gold:#A87A1F;--goldfill:#E3AE3F;--goldbg:#FBF4E3;--paper:#FBF8F1;--coral:#E8765A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);background-image:radial-gradient(#E9E1CF 1.5px,transparent 1.6px);background-size:24px 24px;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:18px;font-weight:700;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:27px;font-weight:900;color:var(--deep);line-height:1.4}
h1 span{background:linear-gradient(transparent 62%,#FFE58A 62%)}
.lead{margin:10px 0 16px;font-weight:500}
.q{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:18px;padding:13px 14px;margin:10px 0;cursor:pointer;transition:all .15s}
.q input{position:absolute;opacity:0;pointer-events:none}
.q .no{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--teal);color:var(--teal);display:grid;place-items:center;font-weight:900;font-size:19px;background:#fff}
.q .tx{flex:1}
.q:has(input:checked){background:var(--soft);border-color:var(--teal)}
.q:has(input:checked) .no{background:var(--teal);color:#fff}
.q:has(input:focus-visible){outline:3px solid var(--goldfill)}
button{font:inherit;font-weight:900;font-size:21px;width:100%;border:none;border-radius:999px;padding:16px;background:var(--teal);color:#fff;margin-top:14px;cursor:pointer}
button.sub{background:#fff;color:var(--deep);border:3px solid var(--line);font-size:18px;padding:12px}
#res{margin-top:8px}
.card{background:#fff;border:3px solid var(--line);border-top:12px solid var(--teal);border-radius:24px;padding:18px 18px 20px;text-align:center}
.card img{height:170px;width:auto;max-width:100%}
.tag{display:inline-block;background:var(--goldfill);color:#3A2A05;border-radius:999px;padding:2px 16px;font-size:16px;font-weight:900}
.name{font-size:32px;font-weight:900;color:var(--deep);line-height:1.3;margin:6px 0 4px}
.one{font-weight:700}
.box{text-align:left;border-radius:16px;padding:12px 14px;margin-top:12px;background:var(--soft)}
.box.g{background:var(--goldbg)}
.box b{display:block;color:var(--deep);font-weight:900}.box.g b{color:var(--gold)}
.cnt{display:flex;gap:8px;margin-top:14px}
.cnt div{flex:1;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;font-size:15px;line-height:1.4}
.cnt div b{display:block;font-size:30px;font-weight:900;color:var(--deep);line-height:1.2}
.cnt div.top{border-color:var(--teal);background:var(--soft)}
.ws{margin-top:12px;background:#fff;border:3px dashed var(--goldfill);border-radius:16px;padding:10px 14px;font-size:17px}
.foot{margin-top:18px;font-size:14px;color:var(--ink2);font-weight:500;text-align:center}
[hidden]{display:none!important}
</style></head><body><main>
<section id="form"><h1><span>自己主張タイプ診断</span></h1><p class="lead">当てはまるものをタップしてください。直感で大丈夫です。10問、1分で終わります。</p>
<label class="q"><input type="checkbox" id="q1"><span class="no">①</span><span class="tx">相手に強く言い返してしまうことが多い</span></label><label class="q"><input type="checkbox" id="q2"><span class="no">②</span><span class="tx">反対意見を言うのが苦手で、我慢することが多い</span></label><label class="q"><input type="checkbox" id="q3"><span class="no">③</span><span class="tx">意見を言うとき、相手の気持ちも気にかける</span></label><label class="q"><input type="checkbox" id="q4"><span class="no">④</span><span class="tx">会議で、自分の意見をはっきり主張する方だ</span></label><label class="q"><input type="checkbox" id="q5"><span class="no">⑤</span><span class="tx">頼まれると断れずに引き受けてしまう</span></label><label class="q"><input type="checkbox" id="q6"><span class="no">⑥</span><span class="tx">相手を否定してでも、自分の考えを押し通すことがある</span></label><label class="q"><input type="checkbox" id="q7"><span class="no">⑦</span><span class="tx">意見を言うときは「私はこう思う」と自分を主語にする</span></label><label class="q"><input type="checkbox" id="q8"><span class="no">⑧</span><span class="tx">相手に気を遣いすぎて、本音を隠すことがある</span></label><label class="q"><input type="checkbox" id="q9"><span class="no">⑨</span><span class="tx">相手と自分、どちらも大切にするよう意識している</span></label><label class="q"><input type="checkbox" id="q10"><span class="no">⑩</span><span class="tx">NOを言うとき、できる範囲の代替案を出す</span></label>
<button id="go" type="button">結果を見る</button></section>
<section id="res" hidden></section>
<p class="foot">第20期リーダー育成塾　コミュニケーション講座②<br>入力した内容は、どこにも送信されません。</p>
